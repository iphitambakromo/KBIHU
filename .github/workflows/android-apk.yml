name: Build APK (Radar IPHI)

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Setup Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          /opt/gradle-8.7/bin/gradle --version

      - name: Build debug APK
        working-directory: android
        run: |
          /opt/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
          exit "${PIPESTATUS[0]}"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radar-iphi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Kirim log kegagalan ke Worker (sementara)
        if: failure()
        run: |
          TAIL=$(tail -c 4000 build.log 2>/dev/null || echo "build.log tidak ada")
          jq -n --arg p "$TAIL" '{path: "android-ci", pesan: $p, level: "error"}' > /tmp/log.json
          curl -s -m 30 -X POST https://traking.iphi-haji.workers.dev/api/pub/log \
            -H 'content-type: application/json' --data @/tmp/log.json || true
