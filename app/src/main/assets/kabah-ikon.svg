<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A2A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B48A2F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E7020;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Kabah Body -->
  <rect x="50" y="60" width="100" height="100" rx="5" fill="url(#gradient)" stroke="#2A2A2A" stroke-width="2"/>
  <rect x="55" y="65" width="90" height="90" rx="3" fill="#2A2A2A" stroke="#1A1A1A" stroke-width="1"/>
  
  <!-- Gold Strip -->
  <rect x="50" y="80" width="100" height="20" fill="url(#gold)" opacity="0.8"/>
  <rect x="50" y="120" width="100" height="20" fill="url(#gold)" opacity="0.8"/>
  
  <!-- Door -->
  <rect x="85" y="130" width="30" height="30" rx="3" fill="#2A2A2A" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="90" y="135" width="20" height="25" rx="2" fill="#1A1A1A"/>
  
  <!-- Black Cloth -->
  <rect x="70" y="40" width="60" height="25" rx="3" fill="#2A2A2A" stroke="#1A1A1A" stroke-width="1"/>
  
  <!-- Gold Top -->
  <circle cx="100" cy="40" r="10" fill="url(#gold)" opacity="0.8"/>
  
  <!-- Shadow -->
  <rect x="55" y="160" width="90" height="10" rx="2" fill="black" opacity="0.3"/>
</svg>